openapi: 3.2.0
info:
  version: 2026.1.6.1
  title: Castor EDC API Documentation Site API
  description: '### Overview

    This document provides the specifications of the Castor EDC API, describing the currently available

    API endpoints and methods. We aim to provide a fully functional RESTful API to communicate with

    Castor EDC and these are endpoints currently available.


    The formal OpenAPI 2 specification by which this page is rendered is also available in the following formats:

    * YAML

    * JSON

    * JSON (pretty print)


    ### Authentication & Authorization with OAuth 2

    Authentication and authorization are arranged through OAuth2. We currently provide full support for the Client

    Credentials flow. The Authorization Code flow is supported, but we ask you to contact us if you want to use this flow.


    To use the Client Credentials flow go to your

    Castor EDC profile and generate

    a Client ID and Client Secret. Use the Client ID and Client Secret to retrieve an access token by making a request to

    the ''/oauth/token'' endpoint with your client_id and client_secret as parameters and grant_type=client_credentials.


    PHP Example:

    ```php

    include __DIR__.''/vendor/autoload.php'';

    use Guzzle\Http\Client;


    // Create the HTTP Client.

    $httpClient = new Client(

    ''https://data.castoredc.com'',

    [

    ''request.options'' => [

    ''exceptions'' => false,

    ]

    ]

    );


    // Build the request

    $request = $httpClient->post(

    ''/oauth/token'',

    null,

    [

    ''client_id'' => ''YourCastorClientId'',

    ''client_secret'' => ''YourCastorClientSecret'',

    ''grant_type'' => ''client_credentials'',

    ]

    );


    // Send the request

    $response = $request->send();

    $responseBody = $response->getBody(true);

    $responseArr = json_decode($responseBody, true);

    $accessToken = $responseArr[''access_token''];

    ```


    In your subsequent requests you can use the `$accessToken` as a Bearer token in the Authorization header, i.e:

    ```php

    $request = $httpClient->get(''/api/user'');

    $request->addHeader(''Authorization'', ''Bearer ''. $accessToken);

    $response = $request->send();

    echo $response->getBody();

    ```


    ### OAuth2 Scopes


    There are 3 scopes that endpoints may support.

    * **default**: allows access to all endpoints

    * **study_statistics**: allows access to study statistics

    * **record**: allows access to data for a single participant


    Due to a bug in the OpenAPI UI, all three scopes are listed for all endpoints.


    If the endpoint supports something other than the default scope, the summary will have a 🔭 emoji and the scope will be

    listed in the description as well as under the `security:` key in the specification.


    ### Rate Limits

    Unless specified in the resource, endpoints are rate-limited to 600 requests in 10 minutes.


    ### Legacy (Basic HTTP Authentication)

    **Please note: Basic HTTP Authentication has been removed on 2019 August 13**


    ### Changelog

    API changes can be viewed here'
  contact:
    name: support@castoredc.com
servers:
- url: https://data.castoredc.com/api/
security:
- OAuth2ClientCredentials:
  - default
  - study_statistics
  - record
tags:
- name: Site
paths:
  /study/{study_id}/site:
    get:
      tags:
      - Site
      summary: Retrieve list of study sites
      security:
      - OAuth2ClientCredentials:
        - default
      description: 'Gets `Site` objects.

        Always requires a study_id to be given. Can be paged.

        Returns HalJson responses (with _links for paging and to single objects).'
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      responses:
        200:
          description: List of all Sites of the Study
          content:
            application/hal+json:
              schema:
                title: Sites HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      sites:
                        type: array
                        items:
                          $ref: '#/components/schemas/Site'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdSite
      x-operation-id-source: derived
    post:
      tags:
      - Site
      summary: Creates a site
      security:
      - OAuth2ClientCredentials:
        - default
      description: Creates `Site` objects.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      responses:
        201:
          description: Site successfully created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/SiteCollection'
        400:
          description: Invalid input
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Not allowed to create sites
        404:
          description: Could not find the study
        422:
          description: Unprocessable entity - site already exists
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/newSite'
        description: "<b>Sites</b> to be created: <br>\n                            <b>name</b> of the Site,\n                            <b>abbreviation</b> of the Site (between 2 and 6 characters),\n                            <b>code</b> of the Site, max 3 characters long,\n                            <b>country_id</b> of the Site.\n                        "
        required: true
      operationId: postStudyByStudyIdSite
      x-operation-id-source: derived
  /study/{study_id}/site/{site_id}:
    get:
      tags:
      - Site
      summary: Retrieve a single Site
      security:
      - OAuth2ClientCredentials:
        - default
      description: Returns HalJson objects (with _links).
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: site_id
        in: path
        description: Site ID of the Site to fetch
        required: true
        schema:
          type: string
      responses:
        200:
          description: Single Site
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Site'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdSiteBySiteId
      x-operation-id-source: derived
components:
  schemas:
    LinksCollection:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
        first:
          type: object
          properties:
            href:
              type: string
        last:
          type: object
          properties:
            href:
              type: string
        next:
          type: object
          properties:
            href:
              type: string
    LinksSingle:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
    Site:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/LinksSingle'
    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP return code.
        title:
          type: string
          description: The short error description belonging to the status code
        detail:
          type: string
          description: The detailed explanation of the failure
        type:
          type: string
          description: URL to RFC explaining this statuscode
        errors:
          type: object
          description: Optional list of all errors that occurred during the request
        validation_messages:
          type: object
          description: Optional list of validation failure message
    newSite:
      type: object
      properties:
        name:
          type: string
        abbreviation:
          type: string
        code:
          type: string
        country_id:
          type: integer
    SiteCreationFailed:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
    SiteNoLinks:
      type: object
      properties:
        id:
          type: string
          format: UUID
        site_id:
          type: string
          format: UUID
        name:
          type: string
        abbreviation:
          type: string
        code:
          type: string
        order:
          type: integer
        country_id:
          type: integer
        deleted:
          type: boolean
    SiteCollection:
      type: object
      description: ''
      properties:
        success:
          type: array
          items:
            $ref: '#/components/schemas/SiteNoLinks'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/SiteCreationFailed'
        total_processed:
          type: number
        total_success:
          type: number
        total_failed:
          type: number
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            default: Grants access to everything
            study_statistics: Grants access to a study's statistics
            record: Grants access to the data for a single participant; intended for use by study subjects
          tokenUrl: https://data.castoredc.com/oauth/token
