openapi: 3.2.0
info:
  version: 2026.1.6.1
  title: Castor EDC API Documentation Survey API
  description: '### Overview

    This document provides the specifications of the Castor EDC API, describing the currently available

    API endpoints and methods. We aim to provide a fully functional RESTful API to communicate with

    Castor EDC and these are endpoints currently available.


    The formal OpenAPI 2 specification by which this page is rendered is also available in the following formats:

    * YAML

    * JSON

    * JSON (pretty print)


    ### Authentication & Authorization with OAuth 2

    Authentication and authorization are arranged through OAuth2. We currently provide full support for the Client

    Credentials flow. The Authorization Code flow is supported, but we ask you to contact us if you want to use this flow.


    To use the Client Credentials flow go to your

    Castor EDC profile and generate

    a Client ID and Client Secret. Use the Client ID and Client Secret to retrieve an access token by making a request to

    the ''/oauth/token'' endpoint with your client_id and client_secret as parameters and grant_type=client_credentials.


    PHP Example:

    ```php

    include __DIR__.''/vendor/autoload.php'';

    use Guzzle\Http\Client;


    // Create the HTTP Client.

    $httpClient = new Client(

    ''https://data.castoredc.com'',

    [

    ''request.options'' => [

    ''exceptions'' => false,

    ]

    ]

    );


    // Build the request

    $request = $httpClient->post(

    ''/oauth/token'',

    null,

    [

    ''client_id'' => ''YourCastorClientId'',

    ''client_secret'' => ''YourCastorClientSecret'',

    ''grant_type'' => ''client_credentials'',

    ]

    );


    // Send the request

    $response = $request->send();

    $responseBody = $response->getBody(true);

    $responseArr = json_decode($responseBody, true);

    $accessToken = $responseArr[''access_token''];

    ```


    In your subsequent requests you can use the `$accessToken` as a Bearer token in the Authorization header, i.e:

    ```php

    $request = $httpClient->get(''/api/user'');

    $request->addHeader(''Authorization'', ''Bearer ''. $accessToken);

    $response = $request->send();

    echo $response->getBody();

    ```


    ### OAuth2 Scopes


    There are 3 scopes that endpoints may support.

    * **default**: allows access to all endpoints

    * **study_statistics**: allows access to study statistics

    * **record**: allows access to data for a single participant


    Due to a bug in the OpenAPI UI, all three scopes are listed for all endpoints.


    If the endpoint supports something other than the default scope, the summary will have a 🔭 emoji and the scope will be

    listed in the description as well as under the `security:` key in the specification.


    ### Rate Limits

    Unless specified in the resource, endpoints are rate-limited to 600 requests in 10 minutes.


    ### Legacy (Basic HTTP Authentication)

    **Please note: Basic HTTP Authentication has been removed on 2019 August 13**


    ### Changelog

    API changes can be viewed here'
  contact:
    name: support@castoredc.com
servers:
- url: https://data.castoredc.com/api/
security:
- OAuth2ClientCredentials:
  - default
  - study_statistics
  - record
tags:
- name: Survey
paths:
  /study/{study_id}/compliance:
    post:
      tags:
      - Survey
      summary: Retrieve participant survey compliance information
      security:
      - OAuth2ClientCredentials:
        - default
      description: Retrieves participant survey compliance. Result is based on the site permissions of the API user.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: The size of pages
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: 'The field to sort on, the default is `participantId`. All available ones are: siteName, participantId, participantStatus, compliance, totalSurveys, completedSurveys'
        required: false
        schema:
          type: string
      - name: dir
        in: query
        description: Sorting direction of the results ASC or DESC, defaults to ASC
        required: false
        schema:
          type: string
      - name: participantId[]
        in: query
        description: Returns compliance result filtered on given participants.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: availabilityStart
        in: query
        description: Returns all surveys available for completion between availabilityStart and availabilityEnd dates. Supported format Y-m-d H:i:s
        required: false
        schema:
          type: string
      - name: availabilityEnd
        in: query
        description: Returns all surveys available for completion between availabilityStart and availabilityEnd dates Supported format Y-m-d H:i:s
        required: false
        schema:
          type: string
      - name: siteId[]
        in: query
        description: Returns compliance result filtered on given sites.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: participantStatus[]
        in: query
        description: Returns compliance result filtered on given participant statuses.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: surveyPackageId[]
        in: query
        description: Returns compliance result filtered on given survey packages.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: surveyPackageStatus[]
        in: query
        description: 'Returns compliance result filtered on survey package status. Available ones are: Created, Completed, Failed, In Progress, Locked, Received, Sent, Viewed'
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: mobile
        in: query
        description: Filter on mobile surveys. Requires mobile surveys to be enabled on the study.
        required: false
        schema:
          type: boolean
      - name: compliance
        in: query
        description: Compliance percentage to filter on, integer between 0 and 100. Requires complianceOption to be set.
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - name: complianceOption
        in: query
        description: Logical operator to be combined with "compliance" parameter.
        required: false
        schema:
          type: string
          enum:
          - '='
          - '>'
          - <
          - <=
          - '>='
      - name: parentId
        in: query
        description: UUID of the visit or repeating data survey parent. Requires the "parentType" parameter.
        required: false
        schema:
          type: string
      - name: parentType
        in: query
        description: '0: No parent. 1: Surveys belongs to a visit. 2: The surveys belongs to a repeating data instance.'
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
      responses:
        200:
          description: List of compliance information
          content:
            application/json:
              schema:
                title: Compliance response
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Compliance'
                  total:
                    type: number
        403:
          description: No site permissions.
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postStudyByStudyIdCompliance
      x-operation-id-source: derived
  /study/{study_id}/surveypackage:
    get:
      deprecated: true
      tags:
      - Survey
      summary: Retrieve list of available Survey Packages
      security:
      - OAuth2ClientCredentials:
        - default
      description: 'Gets `SurveyPackage` objects. A Survey Package is a collection of 1 or more Surveys.

        SurveyPackages get instantiated through SurveyPackageInstances, which are the objects

        to which datapoints really get stored.

        Always requires a study_id to be given. Can be paged.

        Returns HalJson responses (with _links for paging and to single objects).'
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      responses:
        200:
          description: List of all Survey Packages of the Study
          content:
            application/hal+json:
              schema:
                title: SurveyPackages HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      survey_packages:
                        type: array
                        items:
                          $ref: '#/components/schemas/SurveyPackage'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdSurveypackage
      x-operation-id-source: derived
  /study/{study_id}/surveypackage/{survey_package_id}:
    get:
      deprecated: true
      tags:
      - Survey
      summary: Retrieve a single Survey Package
      security:
      - OAuth2ClientCredentials:
        - default
      description: Returns HalJson objects (with _links).
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: survey_package_id
        in: path
        description: Survey Package ID of the Survey Package to fetch
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: 'Adds the option of including fields in the query. Use like: ?include=fields'
        required: false
        schema:
          type: string
      responses:
        200:
          description: Single SurveyPackage
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/SurveyPackage'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdSurveypackageBySurveyPackageId
      x-operation-id-source: derived
  /study/{study_id}/surveypackageinstance:
    get:
      deprecated: true
      tags:
      - Survey
      summary: Retrieve list of available SurveyPackageInstances
      security:
      - OAuth2ClientCredentials:
        - default
      description: 'Gets `SurveyPackageInstance` objects, which are ''instantiations'' of SurveyPackages.

        The SurveyPackageInstance (SPI) is the entity to which the data gets saved, for which email invitations are sent, etc.

        Always requires a study_id to be given. Can be paged.

        Returns HalJson responses (with _links for paging and to single objects).'
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      - name: record_id
        in: query
        description: Filter survey package invitations based on record id. Cannot be combined with "ccr_patient_id"
        required: false
        schema:
          type: string
      - name: ccr_patient_id
        in: query
        description: Filter survey package invitations based on CCR patient id. Cannot be combined with "record_id"
        required: false
        schema:
          type: string
      - name: finished_on
        in: query
        description: 'Filter survey package invitations based on finished date. Multiple modifiers can be applied. Supported formats: 2021-03-20, 2021-03-20 12:34:56, 2021-03-20T12:34:56Z'
        required: false
        schema:
          type: string
      - name: finished_on[gt]
        in: query
        description: Filter survey package invitations that has finished date greater than provided.
        required: false
        schema:
          type: string
      - name: finished_on[gte]
        in: query
        description: Filter survey package invitations that has finished date greater or equal to provided.
        required: false
        schema:
          type: string
      - name: finished_on[lt]
        in: query
        description: Filter survey package invitations that has finished date lower than provided.
        required: false
        schema:
          type: string
      - name: finished_on[lte]
        in: query
        description: Filter survey package invitations that has finished date lower or equal to provided.
        required: false
        schema:
          type: string
      responses:
        200:
          description: List of all Survey Package Instances of the Study
          content:
            application/vnd.swagger+json:
              schema:
                title: SurveyPackageInstances HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      surveypackageinstance:
                        type: array
                        items:
                          $ref: '#/components/schemas/SurveyPackageInstance'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
            application/json:
              schema:
                title: SurveyPackageInstances HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      surveypackageinstance:
                        type: array
                        items:
                          $ref: '#/components/schemas/SurveyPackageInstance'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
            application/xhtml+xml:
              schema:
                title: SurveyPackageInstances HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      surveypackageinstance:
                        type: array
                        items:
                          $ref: '#/components/schemas/SurveyPackageInstance'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
            text/html:
              schema:
                title: SurveyPackageInstances HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      surveypackageinstance:
                        type: array
                        items:
                          $ref: '#/components/schemas/SurveyPackageInstance'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
        default:
          description: Unexpected error
          content:
            application/vnd.swagger+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xhtml+xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdSurveypackageinstance
      x-operation-id-source: derived
    post:
      deprecated: true
      tags:
      - Survey
      summary: Creates a SurveyPackageInstance and (optionally) send the email invite directly
      security:
      - OAuth2ClientCredentials:
        - default
      description: Creates an instantiation of a SurveyPackage for a specific Record.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study to retrieve survey package instances for
        required: true
        schema:
          type: string
          format: UUID
      responses:
        201:
          description: SurveyPackageInstance successfully created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/SurveyPackageInstance'
        404:
          description: The given SurveyPackage or Record does not exist.
        405:
          description: Invalid input
        422:
          description: Unprocessable entity - see error details for more information.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/newOldNamingSurveyPackageInstance'
        description: SurveyPackageInstance details to create the object.
        required: true
      operationId: postStudyByStudyIdSurveypackageinstance
      x-operation-id-source: derived
  /study/{study_id}/surveypackageinstance/{survey_package_instance_id}:
    get:
      deprecated: true
      tags:
      - Survey
      summary: Retrieve a single Survey Package Instance
      security:
      - OAuth2ClientCredentials:
        - default
      description: Returns HalJson objects (with _links)
      parameters:
      - name: study_id
