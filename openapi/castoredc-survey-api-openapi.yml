components:
  schemas:
    BulkPatchParticipantSurveyPackageInstance:
      type: array
      items:
        type: object
        properties:
          survey_package_instance_id:
            type: string
            format: UUID
          date_value:
            type: string
            format: dateTime
            description: The UTC date and time when the filling of a survey package instance has started or when it has been received.
      example:
      - survey_package_instance_id: 27FB1E8C-BF44-4334-94D2-0C3BC3C2548A
        date_value: '2023-06-20 18:10:30'
      - survey_package_instance_id: F7299D50-FD9F-4B59-8B25-C72EDA71D64E
        date_value: '2023-06-21 18:10:30'
    PatchSurveyPackageInstance:
      type: object
      properties:
        locked:
          type: boolean
          description: Set to true to lock or false to unlock the SurveyPackageInstance. Cannot be combined with "status".
        sent_on:
          type: string
          format: dateTime
          description: The UTC date and time when the survey has been sent. Cannot be combined with "locked".
      example:
        sent_on: '2022-07-15 18:10:30'
        locked: true
    LinksCollection:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
        first:
          type: object
          properties:
            href:
              type: string
        last:
          type: object
          properties:
            href:
              type: string
        next:
          type: object
          properties:
            href:
              type: string
    Compliance:
      description: Compliance overview of participant surveys
      type: object
      properties:
        siteName:
          type: string
        siteId:
          type: string
          format: UUID
        totalSurveys:
          type: integer
          description: Total number of surveys used for the compliance calculation
        completedSurveys:
          type: integer
          description: Total number of completed surveys used for the compliance calculation
        participantStatus:
          type: string
        compliance:
          type: integer
          description: The compliance percentage of the participant, represented as 0 - 100 integer value
        participant_id:
          type: string
    LinksSingle:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
    RecordStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Survey:
      type: object
      properties:
        id:
          type: string
          format: UUID
        survey_id:
          type: string
          format: UUID
        name:
          type: string
        description:
          type: string
        intro_text:
          type: string
          format: markdown
        outro_text:
          type: string
          format: markdown
        footer_text:
          type: string
          format: markdown
        survey_forms:
          type: array
