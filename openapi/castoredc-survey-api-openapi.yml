        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: survey_package_instance_id
        in: path
        description: Survey Package Instance ID of the Survey Package Instance to fetch
        required: true
        schema:
          type: string
      responses:
        200:
          description: Single OldNamingSurveyPackageInstance
          content:
            application/vnd.swagger+json:
              schema:
                $ref: '#/components/schemas/OldNamingSurveyPackageInstance'
            application/json:
              schema:
                $ref: '#/components/schemas/OldNamingSurveyPackageInstance'
            application/xhtml+xml:
              schema:
                $ref: '#/components/schemas/OldNamingSurveyPackageInstance'
            text/html:
              schema:
                $ref: '#/components/schemas/OldNamingSurveyPackageInstance'
        default:
          description: Unexpected error
          content:
            application/vnd.swagger+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xhtml+xml:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdSurveypackageinstanceBySurveyPackageInstanceId
      x-operation-id-source: derived
    patch:
      deprecated: true
      tags:
      - Survey
      summary: Locks/unlocks a SurveyPackageInstance
      security:
      - OAuth2ClientCredentials:
        - default
      description: Locks/unlocks an instance of a SurveyPackage. Lock permissions are required in order for this operation to succeed.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: survey_package_instance_id
        in: path
        description: SurveyPackageInstanceId to lock or unlock.
        required: true
        schema:
          type: string
          format: UUID
      responses:
        200:
          description: SurveyPackageInstance successfully updated
        404:
          description: The given SurveyPackage or Record does not exist.
        405:
          description: Invalid input
        422:
          description: Unprocessable entity - see error details for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSurveyPackageInstance'
        description: SurveyPackageInstance details to patch the object.
        required: true
      operationId: patchStudyByStudyIdSurveypackageinstanceBySurveyPackageInstanceId
      x-operation-id-source: derived
  /study/{study_id}/record/{record_id}/surveypackageinstance/{survey_package_instance_id}:
    patch:
      deprecated: true
      tags:
      - Survey
      summary: Updates the start time or the delivery time for a SurveyPackageInstance 🔭
      security:
      - OAuth2ClientCredentials:
        - record
        - default
      description: 'Updates the date and time when the filling of a SurveyPackageInstance has started,

        or the date and time when it has been received. Supports the `record` scope.'
      parameters:
