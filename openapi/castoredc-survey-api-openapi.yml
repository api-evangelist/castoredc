            type: object
            properties:
              id:
                type: string
                format: UUID
              name:
                type: string
              description:
                type: string
              number:
                type: integer
        _links:
          $ref: '#/components/schemas/LinksSingle'
    DateTime:
      type: object
      description: A serialized PHP DateTime object.
