            schema:
              $ref: '#/components/schemas/PatchRecordSurveyPackageInstance'
        description: SurveyPackageInstance details to patch the object.
        required: true
      operationId: patchStudyByStudyIdRecordByRecordIdSurveypackageinstanceBySurveyPackageInstanceId
      x-operation-id-source: derived
  /study/{study_id}/survey:
    get:
      tags:
      - Survey
      summary: Retrieve list of available Surveys
      security:
      - OAuth2ClientCredentials:
