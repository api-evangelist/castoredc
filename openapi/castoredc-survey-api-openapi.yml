                  _links:
                    $ref: '#/components/schemas/LinksSingle'
            survey_reminders:
              $ref: '#/components/schemas/SurveyPackageReminder'
        _links:
          $ref: '#/components/schemas/LinksSingle'
    SurveyPackageReminder:
      type: object
