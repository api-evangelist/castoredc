                $ref: '#/components/schemas/ReportInstance'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdReportInstanceByReportInstanceId
      x-operation-id-source: derived
  /study/{study_id}/record/{record_id}/report-instance-collection:
    post:
      deprecated: true
      tags:
      - report-instance
      summary: Creates a collection of report instances
      security:
      - OAuth2ClientCredentials:
        - default
      description: 'Creates a collection of report instances for a specific record. Report instances are the objects on which data points are

        stored and are required to be created before that happens. They can have a custom name that has to be unique within

        a given record.


        Report instances can have a parent defined to create a tree-like structure of parent/child information elements. Parents

        can be either a phase or another report instance and have to be defined with parent_type and parent_id.


        To store data on repeated measures reports, the parent_type and parent_id should always point to the phase or

        report instance on which the repeated measure field is present.

        (Deprecated, use "repeating-data-instance" instead)'
      parameters:
      - name: study_id
        in: path
        description: The ID of the study to create the report instances for
        required: true
        schema:
          type: string
          format: UUID
      - name: record_id
        in: path
        description: The ID of the record to create the report instances for
        required: true
        schema:
          type: string
      responses:
        201:
          description: Report instances successfully created.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ReportInstanceCollection'
        422:
          description: Duplicate name for report instance
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/newReportInstanceCollection'
        description: Report instance collection data with the details to create them.
        required: true
      operationId: postStudyByStudyIdRecordByRecordIdReportInstanceCollection
      x-operation-id-source: derived
components:
  schemas:
    Report:
      type: object
      properties:
        id:
          type: string
          format: UUID
          description: Unique identifier of the Report (same as report_id)
        report_id:
          type: string
          format: UUID
          description: Unique identifier of the Report(same as id)
        name:
          type: string
          description: Name of the Report
        description:
          type: string
          description: Description of the Report
        type:
          type: string
          description: The report type (event, medication, repeated_measure or other)
        _links:
          $ref: '#/components/schemas/LinksSingle'
    newReportInstanceCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/newReportInstance'
      required:
      - data
    newReportInstance:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
          description: The identifier of the report that should be instantiated in this report instance
        report_name_custom:
          type: string
          description: The name of the report instance. Must be unique within the given record.
        parent_id:
          type: string
          format: uuid
          description: Identifier of the phase or report instance to attach the new report instance to.
      required:
      - report_id
      - report_name_custom
    LinksCollection:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
        first:
          type: object
          properties:
            href:
              type: string
        last:
          type: object
          properties:
            href:
              type: string
        next:
          type: object
          properties:
            href:
              type: string
    LinksSingle:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP return code.
        title:
          type: string
          description: The short error description belonging to the status code
        detail:
          type: string
          description: The detailed explanation of the failure
        type:
          type: string
          description: URL to RFC explaining this statuscode
        errors:
          type: object
          description: Optional list of all errors that occurred during the request
        validation_messages:
          type: object
          description: Optional list of validation failure message
    ReportInstanceCreationFailed:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        record_id:
          type: string
        report_id:
          type: string
          format: UUID
        report_name_custom:
          type: string
    ReportInstanceCollection:
      type: object
      description: 'Allows the creation of multiple report instances at once.

        Always requires a study_id to be given.'
      properties:
        success:
          type: array
          items:
            $ref: '#/components/schemas/ReportInstance'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/ReportInstanceCreationFailed'
        total_processed:
          type: number
        total_success:
          type: number
        total_failed:
          type: number
    ReportInstance:
      type: object
      description: 'The report instance is an instantiation of a report,

        a real copy of a report to which the datapoints get saved.'
      properties:
        id:
          type: string
          format: UUID
          description: Unique id of the report instance.
        name:
          type: string
          description: Name of the report instance.
        report_name:
          type: string
          description: Name of the report.
        status:
          type: string
          description: The status.
        parent_id:
          type: string
          format: UUID
          description: The parent id.
        parent_type:
          type: string
          description: The parent type.
        record_id:
          type: string
          description: The record it belongs to.
        created_on:
          type: string
          format: dateTime
          description: the date the report instance was created.
        created_by:
          type: string
          format: UUID
          description: ID of the user who created the report instance.
        archived:
          type: boolean
          description: Is the report instance archived?
        _embedded:
          type: object
          properties:
            report:
              $ref: '#/components/schemas/Report'
        _links:
          $ref: '#/components/schemas/LinksSingle'
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            default: Grants access to everything
            study_statistics: Grants access to a study's statistics
            record: Grants access to the data for a single participant; intended for use by study subjects
          tokenUrl: https://data.castoredc.com/oauth/token
