  /study/{study_id}/report-instance/{report_instance_id}:
    get:
      deprecated: true
      tags:
      - report-instance
      summary: Retrieve a single report instance
      security:
      - OAuth2ClientCredentials:
        - default
      description: Returns HalJson objects (with _links). (Deprecated, use "repeating-data-instance" instead)
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: report_instance_id
        in: path
        description: Report instance ID to fetch
        required: true
