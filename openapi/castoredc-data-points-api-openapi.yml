paths:
  /study/{study_id}/participant/{participant_id}/data-points/study:
    get:
      tags:
      - data-points
      summary: Retrieves a list of all study data collected for this participant
      security:
      - OAuth2ClientCredentials:
        - default
      description: Returns an array of objects. Unpaged.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: participant_id
        in: path
        description: The ID of the participant for which this call should be made
        required: true
        schema:
          type: string
      - name: field_ids
        in: query
        description: Comma-separated list of field UUIDs to filter the results. Only data points for the specified fields will be returned.
        required: false
        schema:
          type: string
      - name: updated_after
        in: query
        description: ISO 8601 datetime with timezone (e.g., 2024-01-01T00:00:00Z or 2024-01-01T00:00:00+01:00). Only data points updated strictly after this timestamp will be returned.
        required: false
        schema:
          type: string
          format: date-time
      responses:
        200:
          description: List of all the data points
          content:
            application/hal+json:
              schema:
                title: StudyFieldResultCollection
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksSingle'
                  _embedded:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/StudyFieldResultCollection'
                  total_items:
                    type: number
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdParticipantByParticipantIdDataPointsStudy
      x-operation-id-source: derived
    post:
      tags:
      - data-points
      summary: Create/update a collection of field values for a study
      security:
      - OAuth2ClientCredentials:
        - default
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: participant_id
        in: path
        description: The ID of the participant for which this call should be made
        required: true
        schema:
          type: string
      responses:
        201:
          description: Field value successfully created
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/StudyDataPointFieldResultCollection'
        404:
          description: The given Participant or Field does not exist.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        400:
          description: Invalid input
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: Unprocessable entity - see error details for more information.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyDataPointsBody'
        description: "Parameters common to all data points that will be changed\n                                            change_reason is required when changing an existing data point\n                                            for a study with Good Clinical Practice functionality enabled.\n                                            confirmed_changes and change_reason are required when updating\n                                            a signed or verified form."
        required: true
      operationId: postStudyByStudyIdParticipantByParticipantIdDataPointsStudy
      x-operation-id-source: derived
