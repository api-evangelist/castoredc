  LinksCollection:
    type: object
    properties:
      self:
        type: object
        properties:
          href:
            type: string
      first:
        type: object
        properties:
          href:
            type: string
      last:
        type: object
        properties:
          href:
            type: string
      next:
        type: object
        properties:
          href:
            type: string
