  SurveyPackage:
    type: object
    properties:
      id:
        type: string
        format: UUID
        description: 'Unique identifier for the SurveyPackage. Synonymous to survey_package_id.'
      survey_package_id:
        type: string
        format: UUID
        description: 'Unique identifier for the SurveyPackage. Synonymous to id.'
      name:
        type: string
        description: 'Name of the SurveyPackage'
      description:
        type: string
        description: 'Description of the SurveyPackage'
      intro_text:
        type: string
        format: markdown
        description: 'The text shown on the introduction page of the data entry of this SurveyPackage'
      outro_text:
        type: string
        format: markdown
        description: 'The text shown on the finishing page of the data entry of this SurveyPackage'
      sender_name:
        type: string
        description: 'Name shown as sender on the email invitation'
      sender_email:
        type: string
        format: email
        description: 'Reply-to / sender address on the email invitation'
      allow_step_navigation:
        type: boolean
        description: 'Whether survey participants are allowed to navigate between steps'
      show_step_navigator:
        type: boolean
        description: 'Whether the step navigator is shown in the survey data entry view'
      finish_url:
        type: string
        format: URL
        description: 'The URL where a participant is forwarded to upon completion of data entry'
      pre_redirect_text:
        type: string
        description: 'The text shown on the finishing page of the data entry of this SurveyPackage before the participant is redirected to the finish_url'
      auto_5s_redirect:
        type: boolean
        description: 'Whether to enable automatic 5 seconds redirect to the finish_url after completion of data entry'
      auto_lock_on_finish:
        type: boolean
        description: 'Lock instantiations of this SurveyPackage upon completion'
      default_invitation:
        type: string
        format: markdown
        description: 'The default invitation message used for invitation messages in Markdown format. Must contain a {url} tag.'
      default_invitation_subject:
        type: string
        description: 'The default email subject used in the invitation messages.'
      is_mobile:
        type: boolean
        description: 'Whether to send the SurveyPackage via mobile app'
      is_training:
        type: boolean
        description: 'Whether a mobile SurveyPackage is used for training'
      is_repeatable:
        type: boolean
        description: 'Whether a mobile SurveyPackage is repeatable'
      is_resumable:
        type: boolean
        description: 'Whether a mobile SurveyPackage is resumable'
      as_needed:
        type: boolean
        description: 'Whether a mobile SurveyPackage can be completed as needed'
      field_pagination:
        type: string
        description: 'Whether mobile SurveyPackage fields should be paginated and how'
        enum:
          - none
          - forms
      expire_after_hours:
        type: integer
        description: 'Expire after x hours, for mobile enabled SurveyPackages'
      allow_open_survey_link:
        type: boolean
        description: 'Whether an open survey link can be generated for this SurveyPackage'
      _embbeded:
        type: array
        description: 'The list of Surveys that are included in this package'
        items:
          $ref: '#/definitions/Survey'
      _links:
        $ref: '#/definitions/LinksSingle'
  SurveyPackageInstance:
    type: object
    description: "The SurveyPackageInstance is an instantiation of a SurveyPackage,\na real copy a SurveyPackage that gets sent to survey participants."
    properties:
      id:
        type: string
        format: UUID
        description: 'Unique id of the SurveyPackageInstance. Synonymous to survey_package_instance_id'
      survey_package_instance_id:
        type: string
        format: UUID
        description: 'Unique identifier for the SurveyPackageInstance. Synonymous to id.'
      participant_id:
        type: string
        description: 'The identifier of the Participant this SurveyPackageInstance belongs to.'
      site_id:
        type: string
        description: "The identifier of the Site this SurveyPackageInstance's Participant belongs to"
      site_name:
        type: string
        description: "The name of the Site this SurveyPackageInstance's Participant belongs to . "
      survey_package_id:
        type: string
        format: UUID
        description: 'The identifier of the SurveyPackage of which this SurveyPackageInstance is an instantiation from'
      survey_package_name:
        type: string
        description: 'The name of the SurveyPackage of which this SurveyPackageInstance is an instantiation from .'
      invitation_subject:
        type: string
        description: 'The  email subject used in the invitation message for this SurveyPackageInstance.'
      invitation_content:
        type: string
        description: 'The email invitation message for this SurveyPackageInstance.'
      created_on:
        $ref: '#/definitions/DateTime'
      created_by:
        type: string
        format: UUID
        description: 'The user ID of the user who created this instance.'
      sent_on:
        $ref: '#/definitions/DateTime'
      received_on:
        $ref: '#/definitions/DateTime'
      first_opened_on:
        $ref: '#/definitions/DateTime'
      started_on:
        $ref: '#/definitions/DateTime'
      all_fields_filled_on:
        $ref: '#/definitions/DateTime'
      finished_on:
        $ref: '#/definitions/DateTime'
      locked:
        type: boolean
        description: 'Whether this SurveyPackageInstance is locked or not. Locked ones cannot be updated'
      archived:
        type: boolean
        description: 'Archived SurveyPackageInstances are invisible to the enduser. Invitations will not be sent and data will not be exported .'
      survey_url_string:
        type: string
        description: 'The unique identifier used in the URL to open this specific SurveyPackageInstance. URL should point to https://hostname/survey/survey_url_string.'
      progress:
        type: integer
        description: 'The progress of the SurveyPackageInstance, from 0 to 100'
      available_from:
        $ref: '#/definitions/DateTime'
      expire_on:
        $ref: '#/definitions/DateTime'
      auto_lock_on_finish:
        type: boolean
        description: 'Whether this SurveyPackageInstance shall be locked upon completion'
      parent_type:
        type: string
        description: '0: No parent. 1: The survey belongs to a visit. 2: The survey belongs to a repeating data instance.'
      parent_id:
        type: string
        description: 'The UUID of the parent instance.'
      status:
        type: string
        description: 'The status of the survey package instance'
      _embedded:
        type: object
        properties:
          participant:
            $ref: '#/definitions/Participant'
          site:
            $ref: '#/definitions/Site'
          survey_package:
            $ref: '#/definitions/SurveyPackage'
          survey_instances:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: UUID
                progress:
                  type: integer
                progress_total_fields:
                  type: integer
                progress_total_fields_not_empty:
                  type: integer
                survey:
                  $ref: '#/definitions/Survey'
                _links:
                  $ref: '#/definitions/LinksSingle'
          survey_reminders:
            $ref: '#/definitions/SurveyPackageReminder'
      _links:
        $ref: '#/definitions/LinksSingle'
  newSurveyPackageInstance:
    type: object
    properties:
      survey_package_id:
        type: string
        description: 'The identifier of the SurveyPackage that should be instantiated in this SurveyPackageInstance.'
      participant_id:
        type: string
        description: 'The identifier of the Participant to create this SurveyPackageInstance for. Should exist already. Cannot be combined with ccr_patient_id. One of "participant_id" or "ccr_patient_id" is required.'
      ccr_patient_id:
        type: string
        description: 'The CCR Patient identifier of the Participant to create this SurveyPackageInstance for. Should exist already. Cannot be combined with participant_id. One of "participant_id" or "ccr_patient_id" is required.'
      email_address:
        type: string
        description: "The email address this SurveyPackageInstance will be sent to. If no email_address is provided in the request the system will try to use the Participant's stored email address. The email address is stored encrypted."
      package_invitation_subject:
        type: string
        description: 'The subject of the invitation message that will be sent. If left empty will inherit the default subject of the SurveyPackage .'
      package_invitation:
        type: string
        description: "The contents of the invitation message that will be sent. If left empty will inherit the default contents from the SurveyPackage. Must contain a {url} tag that will be replaced with survey_url_string when sending the email. If sending a mobile Survey, it's recommended to reuse the default SurveyPackage invitation message or include the app store tags ({castorconnect-apple-store-link} and {castorconnect-google-store-link}) and the activation QR code tag ({CC-activation-QR})."
      available_from:
        type: string
        format: date-time
        description: 'UTC date and time when the Survey Package Instance should be scheduled. The provided value is converted to server time during creation. Web surveys are scheduled based on **date**, while mobile surveys use **date and time**. If `available_from` is in the past or today, the survey is sent immediately. If in the future, it will be scheduled accordingly. If left empty, the Survey Package Instance will be created but not scheduled.'
      auto_lock_on_finish:
        type: boolean
        default: 'false'
        description: 'Whether the SurveyPackageInstance should be automatically locked when the survey respondent clicks the finish button at the end of data entry .'
      parent_type:
        type: string
        default: '0'
        description: '0: No parent. 1: The survey belongs to a visit. 2: The survey belongs to a repeating data instance.'
      parent_id:
        type: string
        default: 'null'
        description: 'The UUID of the parent instance.'
    required:
      - survey_package_id
      - participant_id
      - ccr_patient_id
