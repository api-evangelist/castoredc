            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: UUID
                progress:
                  type: integer
                progress_total_fields:
                  type: integer
                progress_total_fields_not_empty:
                  type: integer
                survey:
                  $ref: '#/definitions/Survey'
                _links:
                  $ref: '#/definitions/LinksSingle'
          survey_reminders:
            $ref: '#/definitions/SurveyPackageReminder'
