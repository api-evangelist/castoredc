swagger: '2.0'
info:
  version: 2026.1.6.1
  title: 'Castor EDC API Documentation'
  description: "\n### Overview\nThis document provides the specifications of the Castor EDC API, describing the currently available\nAPI endpoints and methods. We aim to provide a fully functional RESTful API to communicate with\nCastor EDC and these are endpoints currently available.\n\nThe formal OpenAPI 2 specification by which this page is rendered is also available in the following formats:\n* [YAML](https://data.castoredc.com/api/swagger)\n* [JSON](https://data.castoredc.com/api/swagger?format=json)\n* [JSON (pretty print)](https://data.castoredc.com/api/swagger?format=json_pretty)\n\n### Authentication & Authorization with OAuth 2\nAuthentication and authorization are arranged through OAuth2. We currently provide full support for the Client\nCredentials flow. The Authorization Code flow is supported, but we ask you to contact us if you want to use this flow.\n\nTo use the Client Credentials flow go to your\n[Castor EDC profile](https://castoredc.link/manual/api/application_programming_interface) and generate\na Client ID and Client Secret. Use the Client ID and Client Secret to retrieve an access token by making a request to\nthe '/oauth/token' endpoint with your client_id and client_secret as parameters and grant_type=client_credentials.\n\nPHP Example:\n```php\ninclude __DIR__.'/vendor/autoload.php';\nuse Guzzle\\Http\\Client;\n\n// Create the HTTP Client.\n$httpClient = new Client(\n    'https://data.castoredc.com',\n    [\n        'request.options' => [\n            'exceptions' => false,\n        ]\n    ]\n);\n\n// Build the request\n$request = $httpClient->post(\n    '/oauth/token',\n    null,\n    [\n        'client_id'     => 'YourCastorClientId',\n        'client_secret' => 'YourCastorClientSecret',\n        'grant_type'    => 'client_credentials',\n    ]\n);\n\n// Send the request\n$response     = $request->send();\n$responseBody = $response->getBody(true);\n$responseArr  = json_decode($responseBody, true);\n$accessToken  = $responseArr['access_token'];\n```\n\nIn your subsequent requests you can use the `$accessToken` as a Bearer token in the Authorization header, i.e:\n```php\n$request = $httpClient->get('/api/user');\n$request->addHeader('Authorization', 'Bearer '. $accessToken);\n$response = $request->send();\necho $response->getBody();\n```\n\n### OAuth2 Scopes\n\nThere are 3 scopes that endpoints may support.\n * **default**: allows access to all endpoints\n * **study_statistics**: allows access to study statistics\n * **record**: allows access to data for a single participant\n\nDue to [a bug in the OpenAPI UI](https://github.com/swagger-api/swagger-ui/issues/5062), all three scopes are listed for all endpoints.\n\nIf the endpoint supports something other than the default scope, the summary will have a 🔭 emoji and the scope will be\nlisted in the description as well as under the `security:` key in the [specification](https://data.castoredc.com/api/swagger).\n\n### Rate Limits\nUnless specified in the resource, endpoints are rate-limited to 600 requests in 10 minutes.\n\n### Legacy (Basic HTTP Authentication)\n**Please note: Basic HTTP Authentication has been removed on 2019 August 13**\n\n### Changelog\nAPI changes can be viewed <a href=\"/api/changelog\" target=\"_blank\">here</a>"
  contact:
    name: support@castoredc.com
host: data.castoredc.com
basePath: /api/
schemes:
  - https
consumes:
  - application/json
produces:
  - application/hal+json
securityDefinitions:
  OAuth2ClientCredentials:
    type: oauth2
    flow: application
    tokenUrl: 'https://data.castoredc.com/oauth/token'
    scopes:
      default: 'Grants access to everything'
      study_statistics: "Grants access to a study's statistics"
      record: 'Grants access to the data for a single participant; intended for use by study subjects'
security:
  -
    OAuth2ClientCredentials:
      - default
      - study_statistics
      - record
paths:
  '/study/{study_id}/audit-trail':
    get:
      tags:
        - beta
      summary: 'Retrieve list of audit trail entries based on input criteria.Please note that this endpoint is currently in beta and implementation details may change.'
      security:
        -
          OAuth2ClientCredentials:
            - default
      description: ''
      parameters:
        -
          name: study_id
          in: path
          description: 'The ID of the study for which this call should be made'
          required: true
          type: string
          format: UUID
        -
          name: page
          in: query
          description: 'The page to retrieve'
          required: false
          type: integer
          default: 1
        -
          name: page_size
          in: query
          description: 'The size of pages'
          required: false
          type: integer
        -
          name: date_from
          in: query
          description: 'Start of date range'
          required: true
          type: string
        -
          name: date_to
          in: query
          description: 'End of date range'
          required: true
          type: string
        -
          name: user_id
          in: query
          description: 'Actor of audit trail entry, "," separated.'
          required: false
          type: string
        -
          name: event_types
          in: query
          description: 'Event types to be returned, "," separated. Event "audit_trail_viewed" must be requested explicitly to be returned.'
          required: false
          type: string
      responses:
        200:
          description: 'List of all audit trail entries of the Study in a given timeframe'
          schema:
            title: 'Audit trail entry HalJSON representation'
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/definitions/AuditTrailEntry'
              extra:
                type: object
                properties:
                  total_pages:
                    type: integer
        422:
          description: 'Unprocessable entity - see error details for more information.'
          schema:
            $ref: '#/definitions/Error'
        default:
          description: 'Unexpected error'
          schema:
            $ref: '#/definitions/Error'
  /country:
    get:
      tags:
        - country
      summary: 'Retrieves the list of all countries'
      security:
        -
          OAuth2ClientCredentials:
            - default
      description: "Gets `Country` objects.\nIs not paged.\nReturns HalJson responses (with _links for paging and to single objects)."
      responses:
        200:
          description: 'List of all countries'
          schema:
            title: 'Countries HalJSON representation'
            type: object
            properties:
              totals:
                type: number
              results:
                type: array
                items:
                  $ref: '#/definitions/CountryWithNoHalLinks'
        default:
          description: 'Unexpected error'
          schema:
            $ref: '#/definitions/Error'
  '/country/{country_id}':
    get:
      tags:
        - country
      summary: 'Retrieve a single Country'
      security:
        -
          OAuth2ClientCredentials:
            - default
      description: 'Returns HalJson objects (with _links).'
      parameters:
        -
          name: country_id
          in: path
          description: 'ID of the country to fetch'
          required: true
          type: string
      responses:
        200:
          description: 'Single Country'
          schema:
            $ref: '#/definitions/Country'
        default:
          description: 'Unexpected error'
          schema:
            $ref: '#/definitions/Error'
  '/study/{study_id}/compliance':
    post:
      tags:
        - survey
      summary: 'Retrieve participant survey compliance information'
      security:
        -
          OAuth2ClientCredentials:
            - default
      consumes:
        - application/json
      produces:
        - application/json
      description: 'Retrieves participant survey compliance. Result is based on the site permissions of the API user.'
      parameters:
        -
          name: study_id
          in: path
          description: 'The ID of the study for which this call should be made'
          required: true
          type: string
          format: UUID
        -
          name: page
          in: query
          description: 'The page to retrieve'
          required: false
          type: integer
          default: 1
        -
          name: page_size
          in: query
          description: 'The size of pages'
          required: false
          type: integer
        -
          name: sort
          in: query
          description: 'The field to sort on, the default is `participantId`. All available ones are: siteName, participantId, participantStatus, compliance, totalSurveys, completedSurveys'
          required: false
          type: string
        -
          name: dir
          in: query
          description: 'Sorting direction of the results ASC or DESC, defaults to ASC'
          required: false
          type: string
        -
          name: 'participantId[]'
          in: query
          description: 'Returns compliance result filtered on given participants.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        -
          name: availabilityStart
          in: query
          description: 'Returns all surveys available for completion between availabilityStart and availabilityEnd dates. Supported format Y-m-d H:i:s'
          required: false
          type: string
        -
          name: availabilityEnd
          in: query
          description: 'Returns all surveys available for completion between availabilityStart and availabilityEnd dates Supported format Y-m-d H:i:s'
          required: false
          type: string
        -
          name: 'siteId[]'
          in: query
          description: 'Returns compliance result filtered on given sites.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        -
          name: 'participantStatus[]'
          in: query
          description: 'Returns compliance result filtered on given participant statuses.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        -
          name: 'surveyPackageId[]'
          in: query
          description: 'Returns compliance result filtered on given survey packages.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        -
          name: 'surveyPackageStatus[]'
          in: query
          description: 'Returns compliance result filtered on survey package status. Available ones are: Created, Completed, Failed, In Progress, Locked, Received, Sent, Viewed'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        -
          name: mobile
          in: query
          description: 'Filter on mobile surveys. Requires mobile surveys to be enabled on the study.'
          required: false
          type: boolean
        -
          name: compliance
          in: query
          description: 'Compliance percentage to filter on, integer between 0 and 100. Requires complianceOption to be set.'
          required: false
          type: integer
          minimum: 0
          maximum: 100
        -
          name: complianceOption
          in: query
          description: 'Logical operator to be combined with "compliance" parameter.'
          required: false
          type: string
          enum:
            - '='
            - '>'
            - '<'
            - '<='
            - '>='
        -
          name: parentId
          in: query
          description: 'UUID of the visit or repeating data survey parent. Requires the "parentType" parameter.'
          required: false
          type: string
        -
          name: parentType
          in: query
          description: '0: No parent. 1: Surveys belongs to a visit. 2: The surveys belongs to a repeating data instance.'
          required: false
          type: string
          enum:
            - '0'
            - '1'
            - '2'
      responses:
        200:
          description: 'List of compliance information'
          schema:
            title: 'Compliance response'
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/definitions/Compliance'
              total:
                type: number
        403:
          description: 'No site permissions.'
        default:
          description: 'Unexpected error'
          schema:
            $ref: '#/definitions/Error'
