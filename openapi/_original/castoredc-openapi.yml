      consumes:
        - application/vnd.swagger+json
        - application/json
        - application/xhtml+xml
        - text/html
      produces:
        - application/vnd.swagger+json
        - application/json
        - application/xhtml+xml
        - text/html
      parameters:
        -
          name: study_id
          in: path
          description: 'The ID of the study for which this call should be made'
          required: true
          type: string
          format: UUID
