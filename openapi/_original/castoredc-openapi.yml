  '/study/{study_id}/survey-package-instance/{survey_package_instance_id}':
    get:
      tags:
        - survey
      summary: 'Retrieve a single Survey Package Instance'
      security:
        -
          OAuth2ClientCredentials:
            - default
      description: 'Returns HalJson objects (with _links)'
      consumes:
        - application/vnd.swagger+json
        - application/json
        - application/xhtml+xml
        - text/html
      produces:
        - application/vnd.swagger+json
        - application/json
        - application/xhtml+xml
        - text/html
      parameters:
        -
          name: study_id
          in: path
          description: 'The ID of the study for which this call should be made'
          required: true
          type: string
          format: UUID
        -
          name: survey_package_instance_id
          in: path
          description: 'Survey Package Instance ID of the Survey Package Instance to fetch'
          required: true
          type: string
      responses:
        200:
          description: 'Single SurveyPackageInstance'
          schema:
            $ref: '#/definitions/SurveyPackageInstance'
        default:
          description: 'Unexpected error'
          schema:
            $ref: '#/definitions/Error'
    patch:
      tags:
        - survey
      summary: 'Updates a SurveyPackageInstance. Can be used to lock/unlock or mark as sent.'
      security:
        -
          OAuth2ClientCredentials:
            - default
      description: "\nThe endpoint allows updating **either** the `locked` status or the `sent_on` datetime of a SurveyPackageInstance.\n\n⚠️ These options are **mutually exclusive**—only one operation is allowed per request.\n\n### Locking/Unlocking\n- Accepts a `boolean` (`true` or `false`).\n- Used to **lock or unlock** a SurveyPackageInstance.\n\n### Marking as sent\n- Accepts a **past** date in **UTC format** (`YYYY-MM-DD HH:MM:SS`).\n- Only applicable for unsent SurveyPackageInstances in the `Created` status.\n- Updating `sent_on` will:\n  - Set **both** `available_from` and `sent_on` to the submitted date.\n  - Update the SurveyPackageInstance status to `Sent`."
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        -
          name: study_id
          in: path
          description: 'The ID of the study for which this call should be made'
          required: true
          type: string
          format: UUID
        -
          name: survey_package_instance_id
          in: path
          description: 'The ID of the SurveyPackageInstance to update.'
          required: true
          type: string
          format: UUID
        -
          name: survey_package_instance
          in: body
          description: 'SurveyPackageInstance details to patch the object.'
          required: true
          schema:
            $ref: '#/definitions/PatchSurveyPackageInstance'
      responses:
        200:
          description: 'SurveyPackageInstance successfully updated'
        404:
          description: 'The given SurveyPackage or Participant does not exist.'
        405:
          description: 'Invalid input'
        422:
          description: 'Unprocessable entity - see error details for more information.'
          schema:
            $ref: '#/definitions/Error'
        default:
          description: 'Unexpected error'
          schema:
            $ref: '#/definitions/Error'
