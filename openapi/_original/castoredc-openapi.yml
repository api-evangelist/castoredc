          name: page
          in: query
          description: 'The page to retrieve'
          required: false
          type: integer
          default: 1
        -
          name: page_size
          in: query
          description: 'The size of pages'
          required: false
          type: integer
        -
          name: participant_id
          in: query
          description: 'Filter survey package invitations based on participant id. Cannot be combined with "ccr_patient_id"'
          required: false
          type: string
        -
          name: ccr_patient_id
          in: query
          description: 'Filter survey package invitations based on CCR patient id. Cannot be combined with "participant_id"'
          required: false
          type: string
        -
          name: sort
          in: query
          description: 'The field to sort on, the default is `createdOn`. All available ones are: availableFrom, progress, createdOn, updatedOn, sentOn, locked, archived, record_id, siteName, survey_package_name, status, finishedOn, startedOn, isMobile, expiresOn'
          required: false
          type: string
        -
          name: dir
          in: query
          description: 'Sorting direction of the results ASC or DESC, defaults to ASC'
          required: false
          type: string
        -
          name: available_from_start
          in: query
          description: 'Filter on survey `available_from` field based on a date range. Requires available_from_end. Supported format Y-m-d H:i:s'
          required: false
          type: string
        -
          name: available_from_end
          in: query
          description: 'Filter on survey `available_from` field based on a date range. Requires available_from_start. Supported format Y-m-d H:i:s'
          required: false
          type: string
        -
          name: available
          in: query
          description: 'If the survey is available based on the current server datetime.'
          required: false
          default: null
          type: boolean
        -
          name: archived
          in: query
          description: 'Filter on surveys that have been archived.'
          required: false
          default: null
          type: boolean
        -
          name: repeatable
          in: query
          description: 'Filter on surveys that have been generated from a repeatable survey.'
          required: false
          default: null
          type: boolean
        -
          name: training
          in: query
          description: 'Filter on surveys belonging to a training configured survey package.'
          required: false
          default: null
          type: boolean
        -
          name: status
          in: query
          description: 'Status to filter on - available ones are: Created, Completed, Failed, In Progress, Locked, Received, Sent, Viewed'
          required: false
          type: string
        -
          name: availability_window_start
          in: query
          description: 'Filter to return surveys that were available for completion within the given time period. Requires availability_window_end. Supported format Y-m-d H:i:s'
          required: false
          type: string
        -
          name: availability_window_end
          in: query
          description: 'Filter to return surveys that were available for completion within the given time period. Requires availability_window_start. Supported format Y-m-d H:i:s'
          required: false
          type: string
        -
          name: finished_on
          in: query
          description: 'Filter survey package invitations based on finished date. Multiple modifiers can be applied. Supported formats: 2021-03-20, 2021-03-20 12:34:56, 2021-03-20T12:34:56Z'
          required: false
          type: string
        -
          name: 'finished_on[gt]'
          in: query
          description: 'Filter survey package invitations that has finished date greater than provided.'
          required: false
          type: string
        -
          name: 'finished_on[gte]'
          in: query
          description: 'Filter survey package invitations that has finished date greater or equal to provided.'
          required: false
          type: string
        -
          name: 'finished_on[lt]'
          in: query
          description: 'Filter survey package invitations that has finished date lower than provided.'
          required: false
          type: string
        -
          name: 'finished_on[lte]'
          in: query
          description: 'Filter survey package invitations that has finished date lower or equal to provided.'
          required: false
          type: string
      responses:
        200:
          description: 'List of all Survey Package Instances of the Study'
