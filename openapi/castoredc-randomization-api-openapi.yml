openapi: 3.2.0
info:
  version: 2026.1.6.1
  title: Castor EDC API Documentation Randomization API
  description: '### Overview

    This document provides the specifications of the Castor EDC API, describing the currently available

    API endpoints and methods. We aim to provide a fully functional RESTful API to communicate with

    Castor EDC and these are endpoints currently available.


    The formal OpenAPI 2 specification by which this page is rendered is also available in the following formats:

    * YAML

    * JSON

    * JSON (pretty print)


    ### Authentication & Authorization with OAuth 2

    Authentication and authorization are arranged through OAuth2. We currently provide full support for the Client

    Credentials flow. The Authorization Code flow is supported, but we ask you to contact us if you want to use this flow.


    To use the Client Credentials flow go to your

    Castor EDC profile and generate

    a Client ID and Client Secret. Use the Client ID and Client Secret to retrieve an access token by making a request to

    the ''/oauth/token'' endpoint with your client_id and client_secret as parameters and grant_type=client_credentials.


    PHP Example:

    ```php

    include __DIR__.''/vendor/autoload.php'';

    use Guzzle\Http\Client;


    // Create the HTTP Client.

    $httpClient = new Client(

    ''https://data.castoredc.com'',

    [

    ''request.options'' => [

    ''exceptions'' => false,

    ]

    ]

    );


    // Build the request

    $request = $httpClient->post(

    ''/oauth/token'',

    null,

    [

    ''client_id'' => ''YourCastorClientId'',

    ''client_secret'' => ''YourCastorClientSecret'',

    ''grant_type'' => ''client_credentials'',

    ]

    );


    // Send the request

    $response = $request->send();

    $responseBody = $response->getBody(true);

    $responseArr = json_decode($responseBody, true);

    $accessToken = $responseArr[''access_token''];

    ```


    In your subsequent requests you can use the `$accessToken` as a Bearer token in the Authorization header, i.e:

    ```php

    $request = $httpClient->get(''/api/user'');

    $request->addHeader(''Authorization'', ''Bearer ''. $accessToken);

    $response = $request->send();

    echo $response->getBody();

    ```


    ### OAuth2 Scopes


    There are 3 scopes that endpoints may support.

    * **default**: allows access to all endpoints

    * **study_statistics**: allows access to study statistics

    * **record**: allows access to data for a single participant


    Due to a bug in the OpenAPI UI, all three scopes are listed for all endpoints.


    If the endpoint supports something other than the default scope, the summary will have a 🔭 emoji and the scope will be

    listed in the description as well as under the `security:` key in the specification.


    ### Rate Limits

    Unless specified in the resource, endpoints are rate-limited to 600 requests in 10 minutes.


    ### Legacy (Basic HTTP Authentication)

    **Please note: Basic HTTP Authentication has been removed on 2019 August 13**


    ### Changelog

    API changes can be viewed here'
  contact:
    name: support@castoredc.com
servers:
- url: https://data.castoredc.com/api/
security:
- OAuth2ClientCredentials:
  - default
  - study_statistics
  - record
tags:
- name: randomization
paths:
  /study/{study_id}/participant/{participant_id}/randomization:
    get:
      tags:
      - randomization
      summary: Retrieve a single RandomizationDetails
      security:
      - OAuth2ClientCredentials:
        - default
      description: ''
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: participant_id
        in: path
        description: Participant ID of the RandomizationDetails to fetch
        required: true
        schema:
          type: string
      responses:
        200:
          description: Single RandomizationDetails
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RandomizationDetails'
        403:
          description: Not allowed to view randomization data for this site
        404:
          description: ParticipantRandomizationDetails not found.
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdParticipantByParticipantIdRandomization
      x-operation-id-source: derived
    post:
      tags:
      - randomization
      summary: Randomize a participant
      security:
      - OAuth2ClientCredentials:
        - default
      description: Randomize a participant if possible. Returns HalJson objects (with _links).
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: participant_id
        in: path
        description: Participant ID of the RandomizationDetails to fetch
        required: true
        schema:
          type: string
      responses:
        201:
          description: Participant successfully randomized
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RandomizationDetails'
        400:
          description: Randomization errors
        403:
          description: User should have "randomization write" permission for participant randomization.
        404:
          description: A participant with Participant ID doesn't exist.
        422:
          description: A participant with Participant ID is already randomized.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postStudyByStudyIdParticipantByParticipantIdRandomization
      x-operation-id-source: derived
  /study/{study_id}/record/{record_id}/randomization:
    get:
      deprecated: true
      tags:
      - randomization
      summary: Retrieve a single RandomizationDetails
      security:
      - OAuth2ClientCredentials:
        - default
      description: (Deprecated, use "participant-randomization" instead)
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: record_id
        in: path
        description: Record ID of the RandomizationDetails to fetch
        required: true
        schema:
          type: string
      responses:
        200:
          description: Single RandomizationDetails
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RandomizationDetails'
        403:
          description: Not allowed to view randomization data for this institute
        404:
          description: RecordRandomizationDetails not found.
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdRecordByRecordIdRandomization
      x-operation-id-source: derived
    post:
      deprecated: true
      tags:
      - randomization
      summary: Randomize a record
      security:
      - OAuth2ClientCredentials:
        - default
      description: Randomize a record if possible. Returns HalJson objects (with _links). (Deprecated, use "participant-randomization" instead)
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: record_id
        in: path
        description: Record ID of the RandomizationDetails to fetch
        required: true
        schema:
          type: string
      responses:
        201:
          description: Record successfully randomized
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RandomizationDetails'
        400:
          description: Randomization errors
        403:
          description: User should have "randomization write" permission for record randomization.
        404:
          description: A record with Record ID doesn't exist.
        422:
          description: A record with Record ID is already randomized.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: postStudyByStudyIdRecordByRecordIdRandomization
      x-operation-id-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP return code.
        title:
          type: string
          description: The short error description belonging to the status code
        detail:
          type: string
          description: The detailed explanation of the failure
        type:
          type: string
          description: URL to RFC explaining this statuscode
        errors:
          type: object
          description: Optional list of all errors that occurred during the request
        validation_messages:
          type: object
          description: Optional list of validation failure message
    DateTime:
      type: object
      description: A serialized PHP DateTime object.
      properties:
        date:
          type: string
          description: Date and time in Y-m-d H:i:s.u format.
        timezone_type:
          type: integer
        timezone:
          type: string
    RandomizationDetails:
      type: object
      properties:
        randomized_id:
          type: string
        randomization_group:
          type: string
        randomization_group_name:
          type: string
        randomized_on:
          $ref: '#/components/schemas/DateTime'
        _links:
          $ref: '#/components/schemas/LinksSingle'
    LinksSingle:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            default: Grants access to everything
            study_statistics: Grants access to a study's statistics
            record: Grants access to the data for a single participant; intended for use by study subjects
          tokenUrl: https://data.castoredc.com/oauth/token
