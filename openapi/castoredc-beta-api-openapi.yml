openapi: 3.2.0
info:
  version: 2026.1.6.1
  title: Castor EDC API Documentation Beta API
  description: '### Overview

    This document provides the specifications of the Castor EDC API, describing the currently available

    API endpoints and methods. We aim to provide a fully functional RESTful API to communicate with

    Castor EDC and these are endpoints currently available.


    The formal OpenAPI 2 specification by which this page is rendered is also available in the following formats:

    * YAML

    * JSON

    * JSON (pretty print)


    ### Authentication & Authorization with OAuth 2

    Authentication and authorization are arranged through OAuth2. We currently provide full support for the Client

    Credentials flow. The Authorization Code flow is supported, but we ask you to contact us if you want to use this flow.


    To use the Client Credentials flow go to your

    Castor EDC profile and generate

    a Client ID and Client Secret. Use the Client ID and Client Secret to retrieve an access token by making a request to

    the ''/oauth/token'' endpoint with your client_id and client_secret as parameters and grant_type=client_credentials.


    PHP Example:

    ```php

    include __DIR__.''/vendor/autoload.php'';

    use Guzzle\Http\Client;


    // Create the HTTP Client.

    $httpClient = new Client(

    ''https://data.castoredc.com'',

    [

    ''request.options'' => [

    ''exceptions'' => false,

    ]

    ]

    );


    // Build the request

    $request = $httpClient->post(

    ''/oauth/token'',

    null,

    [

    ''client_id'' => ''YourCastorClientId'',

    ''client_secret'' => ''YourCastorClientSecret'',

    ''grant_type'' => ''client_credentials'',

    ]

    );


    // Send the request

    $response = $request->send();

    $responseBody = $response->getBody(true);

    $responseArr = json_decode($responseBody, true);

    $accessToken = $responseArr[''access_token''];

    ```


    In your subsequent requests you can use the `$accessToken` as a Bearer token in the Authorization header, i.e:

    ```php

    $request = $httpClient->get(''/api/user'');

    $request->addHeader(''Authorization'', ''Bearer ''. $accessToken);

    $response = $request->send();

    echo $response->getBody();

    ```


    ### OAuth2 Scopes


    There are 3 scopes that endpoints may support.

    * **default**: allows access to all endpoints

    * **study_statistics**: allows access to study statistics

    * **record**: allows access to data for a single participant


    Due to a bug in the OpenAPI UI, all three scopes are listed for all endpoints.


    If the endpoint supports something other than the default scope, the summary will have a 🔭 emoji and the scope will be

    listed in the description as well as under the `security:` key in the specification.


    ### Rate Limits

    Unless specified in the resource, endpoints are rate-limited to 600 requests in 10 minutes.


    ### Legacy (Basic HTTP Authentication)

    **Please note: Basic HTTP Authentication has been removed on 2019 August 13**


    ### Changelog

    API changes can be viewed here'
  contact:
    name: support@castoredc.com
servers:
- url: https://data.castoredc.com/api/
security:
- OAuth2ClientCredentials:
  - default
  - study_statistics
  - record
tags:
- name: Beta
paths:
  /study/{study_id}/audit-trail:
    get:
      tags:
      - Beta
      summary: Retrieve list of audit trail entries based on input criteria.Please note that…
      security:
      - OAuth2ClientCredentials:
        - default
      description: ''
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: The size of pages
        required: false
        schema:
          type: integer
      - name: date_from
        in: query
        description: Start of date range
        required: true
        schema:
          type: string
      - name: date_to
        in: query
        description: End of date range
        required: true
        schema:
          type: string
      - name: user_id
        in: query
        description: Actor of audit trail entry, "," separated.
        required: false
        schema:
          type: string
      - name: event_types
        in: query
        description: Event types to be returned, "," separated. Event "audit_trail_viewed" must be requested explicitly to be returned.
        required: false
        schema:
          type: string
      responses:
        200:
          description: List of all audit trail entries of the Study in a given timeframe
          content:
            application/hal+json:
              schema:
                title: Audit trail entry HalJSON representation
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditTrailEntry'
                  extra:
                    type: object
                    properties:
                      total_pages:
                        type: integer
        422:
          description: Unprocessable entity - see error details for more information.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdAuditTrail
      x-operation-id-source: derived
  /study/{study_id}/export:
    post:
      tags:
      - Beta
      summary: Request exports of multiple types
      security:
      - OAuth2ClientCredentials:
        - default
      description: This batch endpoint supports initiating multiple, distinct export types in a single request.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made.
        required: true
        schema:
          type: string
          format: UUID
      responses:
        201:
          description: Successful batch export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportSuccess'
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchExportRequest'
        description: 'Please note that this endpoint is currently in beta and implementation details may change.


          Export format, options, and filters depend on the export type. All filters are optional.

          Please find a description of some parameters below.

          - filters.participant_ids: <b>If provided, other filters will be skipped.</b>

          - queries.elements: Only one type at a time is supported, so provide either repeating_data, visits or visit_forms key.

          - survey_compliance.parent_id: Visit/Repeating data UUID.


          To demonstrate use of all supported ENUM values, following notation is used in request payload:

          <b>empty | visit | repeating_data</b> - meaning in this example, all three values are supported.

          '
        required: true
      operationId: postStudyByStudyIdExport
      x-operation-id-source: derived
  /study/{study_id}/participant/{participant_id}/monitoring/validations:
    get:
      tags:
      - Beta
      summary: Fetch triggered validations per participant
      security:
      - OAuth2ClientCredentials:
        - default
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: participant_id
        in: path
        required: true
        description: The ID of the participant for which to retrieve validations
        schema:
          type: string
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: The size of pages
        required: false
        schema:
          type: integer
      - name: include_referenced_field
        in: query
        description: 'Include validations with referenced field. When false (default), only value-based validations are returned. (Deprecated: check API changelog for more information)'
        required: false
        schema:
          type: boolean
          default: false
      responses:
        200:
          description: List of all validations
          content:
            application/json:
              schema:
                title: MonitoringValidationsCollection
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksSingle'
                  _embedded:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MonitoringValidationsCollection'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdParticipantByParticipantIdMonitoringValidations
      x-operation-id-source: derived
