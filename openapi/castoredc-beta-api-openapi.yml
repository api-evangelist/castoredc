  /study/{study_id}/domains:
    get:
      tags:
      - Beta
      summary: Request data standardization related information (Domains)
      security:
      - OAuth2ClientCredentials:
        - default
      description: Request data standardization related information (Domains).
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      responses:
        200:
          description: List of all the domains with configured fields.
          content:
            application/json:
              schema:
                type: object
