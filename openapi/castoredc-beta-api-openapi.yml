  /study/{study_id}/validations/{validation_id}/history:
    get:
      tags:
      - Beta
      summary: Fetch validation history for the given triggered validation
      security:
      - OAuth2ClientCredentials:
        - default
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: validation_id
        in: path
        required: true
        description: The ID of the triggered validation to retrieve related history
        schema:
          type: string
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: The size of pages
        required: false
        schema:
          type: integer
      responses:
        200:
          description: List of all validation history entries for a given validation
          content:
            application/json:
              schema:
                title: ValidationHistoryCollection
                type: object
