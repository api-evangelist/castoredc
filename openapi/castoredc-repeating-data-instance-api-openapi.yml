  /study/{study_id}/repeating-data-instance/{repeating_data_instance_id}:
    get:
      tags:
      - repeating-data-instance
      summary: Retrieve a single repeating data instance
      security:
      - OAuth2ClientCredentials:
        - default
      description: Returns HalJson objects (with _links)
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: repeating_data_instance_id
        in: path
        description: Repeating Data Instance ID to fetch
        required: true
        schema:
          type: string
      responses:
        200:
          description: Single RepeatingDataInstance
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RepeatingDataInstance'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdRepeatingDataInstanceByRepeatingDataInstanceId
      x-operation-id-source: derived
  /study/{study_id}/participant/{participant_id}/repeating-data-instance-collection:
    post:
      tags:
      - repeating-data-instance
      summary: Creates a collection of repeating data instances
      security:
      - OAuth2ClientCredentials:
        - default
      description: 'Creates a collection of repeating data instances for a specific participant. Repeating data instances are the objects on which data points are

        stored and are required to be created before that happens. They can have a custom name that has to be unique within

        a given participant.


        Repeating data instances can have a parent defined to create a tree-like structure of parent/child information elements. Parents

        can be either a visit or another repeating data instance and have to be defined with parent_type and parent_id.


        To store data on repeated measures repeating data, the parent_type and parent_id should always point to the visit or

        repeating data instance on which the repeated measure field is present.'
      parameters:
      - name: study_id
        in: path
        description: The ID of the study to create the repeating data instances for
        required: true
        schema:
          type: string
          format: UUID
      - name: participant_id
        in: path
        description: The ID of the participant to create the repeating data instances for
        required: true
        schema:
          type: string
      responses:
        201:
          description: Repeating data instances successfully created.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RepeatingDataInstanceCollection'
        400:
          description: Could not create the repeating data instances due to a domain error. See the errors/detail property for additional information.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: No permissions to create the repeating data instances or the repeating data instances are blinded. See the errors/detail property for additional information.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: Duplicate name for repeating data instance
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/newRepeatingDataInstanceCollection'
        description: Repeating data instance collection data with the details to create them.
        required: true
      operationId: postStudyByStudyIdParticipantByParticipantIdRepeatingDataInstanceCollection
      x-operation-id-source: derived
components:
  schemas:
    newRepeatingDataInstanceCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/newRepeatingDataInstance'
      required:
      - data
    newRepeatingDataInstance:
      type: object
      properties:
        repeating_data_id:
          type: string
          format: uuid
          description: The identifier of the repeating data that should be instantiated in this repeating data instance
        repeating_data_name_custom:
          type: string
          description: The name of the repeating data instance. Must be unique within the given participant.
        parent_id:
          type: string
          format: uuid
          description: Identifier of the visit or repeating data instance to attach the new repeating data instance to.
      required:
      - repeating_data_id
      - repeating_data_name_custom
    RepeatingData:
      type: object
      properties:
        id:
          type: string
          format: UUID
          description: Unique identifier of the Repeating Data (same as repeating_data_id)
        repeating_data_id:
          type: string
          format: UUID
          description: Unique identifier of the Repeating Data(same as id)
        name:
          type: string
          description: Name of the Repeating Data
        description:
          type: string
          description: Description of the Repeating Data
        type:
          type: string
          description: The repeating data type (event, medication, repeated_measure or other)
        _links:
          $ref: '#/components/schemas/LinksSingle'
    RepeatingDataInstance:
      type: object
      description: 'The repeating data instance is an instantiation of repeating data,

        a real copy of repeating data to which the data points get saved.'
      properties:
        id:
          type: string
          format: UUID
          description: Unique id of the repeating data instance.
        name:
          type: string
          description: Name of the repeating data instance.
        repeating data_name:
          type: string
          description: Name of the repeating data.
        status:
          type: string
          description: The status.
        parent_id:
          type: string
          format: UUID
          description: The parent id.
        parent_type:
          type: string
          description: The parent type.
        participant_id:
          type: string
          description: The participant it belongs to.
        created_on:
          type: string
          format: dateTime
          description: the date the repeating data instance was created.
        created_by:
          type: string
          format: UUID
          description: ID of the user who created the repeating data instance.
        archived:
          type: boolean
          description: Is the repeating data instance archived?
        _embedded:
          type: object
          properties:
            repeating_data:
              $ref: '#/components/schemas/RepeatingData'
        _links:
          $ref: '#/components/schemas/LinksSingle'
    LinksCollection:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
        first:
          type: object
          properties:
            href:
              type: string
        last:
          type: object
          properties:
            href:
              type: string
        next:
          type: object
          properties:
            href:
              type: string
    LinksSingle:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
    Error:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: The HTTP return code.
        title:
          type: string
          description: The short error description belonging to the status code
        detail:
          type: string
          description: The detailed explanation of the failure
        type:
          type: string
          description: URL to RFC explaining this statuscode
        errors:
          type: object
          description: Optional list of all errors that occurred during the request
        validation_messages:
          type: object
          description: Optional list of validation failure message
    RepeatingDataInstanceCreationFailed:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        participant_id:
          type: string
        repeating_data_id:
          type: string
          format: UUID
        repeating_data_name_custom:
          type: string
    RepeatingDataInstanceCollection:
      type: object
      description: 'Allows the creation of multiple repeating data instances at once.

        Always requires a study_id to be given.'
      properties:
        success:
          type: array
          items:
            $ref: '#/components/schemas/RepeatingDataInstance'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/RepeatingDataInstanceCreationFailed'
        total_processed:
          type: number
        total_success:
          type: number
        total_failed:
          type: number
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            default: Grants access to everything
            study_statistics: Grants access to a study's statistics
            record: Grants access to the data for a single participant; intended for use by study subjects
          tokenUrl: https://data.castoredc.com/oauth/token
