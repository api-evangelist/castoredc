openapi: 3.2.0
info:
  version: 2026.1.6.1
  title: Castor EDC API Documentation Survey Data Entry API
  description: '### Overview

    This document provides the specifications of the Castor EDC API, describing the currently available

    API endpoints and methods. We aim to provide a fully functional RESTful API to communicate with

    Castor EDC and these are endpoints currently available.


    The formal OpenAPI 2 specification by which this page is rendered is also available in the following formats:

    * YAML

    * JSON

    * JSON (pretty print)


    ### Authentication & Authorization with OAuth 2

    Authentication and authorization are arranged through OAuth2. We currently provide full support for the Client

    Credentials flow. The Authorization Code flow is supported, but we ask you to contact us if you want to use this flow.


    To use the Client Credentials flow go to your

    Castor EDC profile and generate

    a Client ID and Client Secret. Use the Client ID and Client Secret to retrieve an access token by making a request to

    the ''/oauth/token'' endpoint with your client_id and client_secret as parameters and grant_type=client_credentials.


    PHP Example:

    ```php

    include __DIR__.''/vendor/autoload.php'';

    use Guzzle\Http\Client;


    // Create the HTTP Client.

    $httpClient = new Client(

    ''https://data.castoredc.com'',

    [

    ''request.options'' => [

    ''exceptions'' => false,

    ]

    ]

    );


    // Build the request

    $request = $httpClient->post(

    ''/oauth/token'',

    null,

    [

    ''client_id'' => ''YourCastorClientId'',

    ''client_secret'' => ''YourCastorClientSecret'',

    ''grant_type'' => ''client_credentials'',

    ]

    );


    // Send the request

    $response = $request->send();

    $responseBody = $response->getBody(true);

    $responseArr = json_decode($responseBody, true);

    $accessToken = $responseArr[''access_token''];

    ```


    In your subsequent requests you can use the `$accessToken` as a Bearer token in the Authorization header, i.e:

    ```php

    $request = $httpClient->get(''/api/user'');

    $request->addHeader(''Authorization'', ''Bearer ''. $accessToken);

    $response = $request->send();

    echo $response->getBody();

    ```


    ### OAuth2 Scopes


    There are 3 scopes that endpoints may support.

    * **default**: allows access to all endpoints

    * **study_statistics**: allows access to study statistics

    * **record**: allows access to data for a single participant


    Due to a bug in the OpenAPI UI, all three scopes are listed for all endpoints.


    If the endpoint supports something other than the default scope, the summary will have a 🔭 emoji and the scope will be

    listed in the description as well as under the `security:` key in the specification.


    ### Rate Limits

    Unless specified in the resource, endpoints are rate-limited to 600 requests in 10 minutes.


    ### Legacy (Basic HTTP Authentication)

    **Please note: Basic HTTP Authentication has been removed on 2019 August 13**


    ### Changelog

    API changes can be viewed here'
  contact:
    name: support@castoredc.com
servers:
- url: https://data.castoredc.com/api/
security:
- OAuth2ClientCredentials:
  - default
  - study_statistics
  - record
tags:
- name: survey-data-entry
paths:
  /study/{study_id}/record/{record_id}/data-point/survey/{survey_instance_id}:
    get:
      deprecated: true
      tags:
      - survey-data-entry
      summary: Retrieve list of all stored values for a record's survey 🔭
      security:
      - OAuth2ClientCredentials:
        - record
        - default
      description: 'Gets `SurveyDataPoint` objects that contain the stored value for a specific survey field in a specific record.

        Always requires a study_id, a record_id and one of either survey_instance_id or survey_package_instance_id to be given.

        Can be paged. Returns HalJson responses (with _links for paging and to single objects). Supports the `record` scope.'
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: page
        in: query
        description: The page to retrieve
        required: false
        schema:
          type: integer
          default: 1
      - name: record_id
        in: path
        description: The ID of the record to retrieve field values for
        required: true
        schema:
          type: string
      - name: survey_instance_id
        in: path
        description: The survey instance id or survey package instance id of the record to retrieve field values for
        required: true
        schema:
          type: string
      - name: validations
        in: query
        description: Set to 1 to include the list of validations for each field
        required: false
        schema:
          type: integer
          default: 0
      responses:
        200:
          description: List of all survey field values for a survey of a specific record.
          content:
            application/hal+json:
              schema:
                title: SurveyInstanceFieldResults HalJSON representation
                type: object
                properties:
                  _links:
                    $ref: '#/components/schemas/LinksCollection'
                  _embedded:
                    type: object
                    properties:
                      SurveyDataPoints:
                        type: array
                        items:
                          $ref: '#/components/schemas/OldNamingSurveyInstanceFieldResult'
                  page_count:
                    type: number
                  page_size:
                    type: number
                  total_items:
                    type: number
                  page:
                    type: number
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdRecordByRecordIdDataPointSurveyBySurveyInstanceId
      x-operation-id-source: derived
  /study/{study_id}/record/{record_id}/data-point/survey/{survey_instance_id}/{field_id}:
    get:
      deprecated: true
      tags:
      - survey-data-entry
      summary: Retrieve a single SurveyInstanceFieldResult object 🔭
      security:
      - OAuth2ClientCredentials:
        - record
        - default
      description: Returns HalJson objects (with _links). Supports the `record` scope.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: record_id
        in: path
        description: ID of the record
        required: true
        schema:
          type: string
      - name: field_id
        in: path
        description: ID of the field
        required: true
        schema:
          type: string
      - name: survey_instance_id
        in: path
        description: ID of the survey (package) instance
        required: true
        schema:
          type: string
      - name: validations
        in: query
        description: Set to 1 to include the list of validations for each field
        required: false
        schema:
          type: integer
          default: 0
      responses:
        200:
          description: Single SurveyInstanceFieldResult
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/SurveyInstanceFieldResult'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getStudyByStudyIdRecordByRecordIdDataPointSurveyBySurveyInstanceIdByFieldId
      x-operation-id-source: derived
    post:
      deprecated: true
      tags:
      - survey-data-entry
      summary: Create a field result for a survey (package) instance 🔭
      security:
      - OAuth2ClientCredentials:
        - record
        - default
      description: Create a field result for a survey (package) instance. Supports the `record` scope.
      parameters:
      - name: study_id
        in: path
        description: The ID of the study for which this call should be made
        required: true
        schema:
          type: string
          format: UUID
      - name: record_id
        in: path
        description: The ID of the record
        required: true
        schema:
          type: string
      - name: field_id
        in: path
        description: The field identifier
        required: true
        schema:
          type: string
          format: UUID
      - name: survey_instance_id
        in: path
        description: ID of the survey instance or its parent survey package instance
        required: true
        schema:
          type: string
      responses:
        201:
          description: Field value successfully created
        404:
          description: The given Record, Field or Survey(Package)Instance does not exist.
        400:
          description: Invalid input
        422:
          description: Unprocessible entity - see error details for more information.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/vnd.swagger+json:
            schema:
              type: object
              properties:
                field_value:
                  type: string
                  description: The value. If empty, it will clear any stored value, including uploaded files.
                change_reason:
                  type: string
                  description: Required change reason when GCP is enabled and there is already a data point that is being changed.
                upload_file:
                  type: string
                  description: Optional field. If supplied, the "field_value" parameter needs to be omitted. The contents will be uploaded. The upload limit is 2MB
                  format: binary
          application/json:
            schema:
              type: object
              properties:
                field_value:
                  type: string
                  description: The value. If empty, it will clear any stored value, including uploaded files.
                change_reason:
                  type: string
                  description: Required change reason when GCP is enabled and there is already a data point that is being changed.
                upload_file:
                  type: string
                  description: Optional field. If supplied, the "field_value" parameter needs to be omitted. The contents will be uploaded. The upload limit is 2MB
                  format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                field_value:
                  type: string
                  description: The value. If empty, it will clear any stored value, including uploaded files.
                change_reason:
                  type: string
                  description: Required change reason when GCP is enabled and there is already a data point that is being changed.
                upload_file:
                  type: string
                  description: Optional field. If supplied, the "field_value" parameter needs to be omitted. The contents will be uploaded. The upload limit is 2MB
                  format: binary
      operationId: postStudyByStudyIdRecordByRecordIdDataPointSurveyBySurveyInstanceIdByFieldId
      x-operation-id-source: derived
